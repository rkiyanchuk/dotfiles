set -g default-terminal "tmux-256color"
set -gas terminal-features ",*ghostty*:RGB:hyperlinks:osc7:strikethrough:usstyle"

set -s escape-time 0
set -g focus-events on
set -g allow-passthrough all
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g mode-keys vi
set -g monitor-activity on
set -g mouse on
set -g visual-activity off
set -g set-titles on
set -g set-titles-string "#T"

set -g set-clipboard on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000
set -g display-time 4000
set -g status-keys emacs
setw -g aggressive-resize on

set -g status-interval 0


# BINDINGS
# ========

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel

# Mouse wheel scroll rate
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down
bind-key -T copy-mode    WheelUpPane   select-pane \; send -X -N 1 scroll-up
bind-key -T copy-mode    WheelDownPane select-pane \; send -X -N 1 scroll-down

# Splits, Ghostty-style (preserve current path); d displaces detach onto C-d
bind-key d split-window -h -c "#{pane_current_path}"
bind-key D split-window -v -c "#{pane_current_path}"
bind-key C-d detach-client
bind-key c new-window -c "#{pane_current_path}"
unbind-key "%"
unbind-key '"'

bind-key -n "M-]" select-pane -t :.+
bind-key -n "M-[" select-pane -t :.-
bind-key -n "M-}"   next-window
bind-key -n "M-S-]" next-window
bind-key -n "M-S-}" next-window
bind-key -n "M-{"   previous-window
bind-key -n "M-S-[" previous-window
bind-key -n "M-S-{" previous-window

# Pane resizing
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Window swapping
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# Window navigation and config reload
bind-key C-p previous-window
bind-key C-n next-window
bind-key b   last-window
bind-key R source-file "${HOME}/.config/tmux/tmux.conf" \; display-message "Sourced tmux.conf"


# APPEARANCE
# ==========

# One Dark: status bg #282c34, inactive pill #353b45, active pill #3e4451,
# accent #61afef, foreground #abb2bf, muted #565c64, warning #e5c07b.
set -g status on
set -g status-justify left
set -g status-left-length 100

set -g status-style "bg=#282c34,fg=#abb2bf"
set -g message-style "bg=#282c34,fg=#abb2bf"
set -g message-command-style "bg=#282c34,fg=#abb2bf"
set -g mode-style "bg=#3e4451,fg=#61afef"

# Dim the text of unfocused panes.
set -g window-style "fg=#565c64"
set -g window-active-style "fg=#abb2bf"
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
set -g display-panes-colour "#61afef"
set -g display-panes-active-colour "#e5c07b"

setw -g window-status-style "bg=#282c34,fg=#abb2bf"
setw -g window-status-activity-style "bg=#282c34,fg=#abb2bf"
setw -g window-status-bell-style "bg=#282c34,fg=#abb2bf"

# Pill-shaped window indicators.
set -g window-status-current-format "#[fg=#3e4451,bg=#282c34]#[fg=#61afef,bg=#3e4451,bold] #I #[fg=#abb2bf]#W #[fg=#3e4451,bg=#282c34,nobold]"
set -g window-status-format "#[fg=#353b45,bg=#282c34]#[fg=#{?window_bell_flag,#e06c75,#{?window_activity_flag,#e5c07b,#565c64}},bg=#353b45] #I #[fg=#abb2bf]#W #[fg=#353b45,bg=#282c34,nobold]"
set -g window-status-separator " "
set -g status-left "#[fg=#61afef,bg=#282c34]#[fg=#3e4451,bg=#61afef,bold] #{?client_prefix,󰠠 ,#[dim]󰤂 }#[bold,nodim]#S #[fg=#61afef,bg=#282c34,nobold] "
set -g status-right ""
