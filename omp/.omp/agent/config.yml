symbolPreset: nerd
theme:
  dark: dark-one-hl
  light: light-one
setupVersion: 2
modelRoles:
  default: anthropic/claude-opus-5-5
  slow: anthropic/claude-fable-5-1:auto
  task: anthropic/claude-opus-5-5:xhigh
  commit: anthropic/claude-sonnet-5-5:auto
  smol: anthropic/claude-sonnet-5-5
  vision: openai-codex/gpt-6.1-sol
  plan: anthropic/claude-opus-5-5:auto
  advisor: openai-codex/gpt-6.1-sol:auto
  security: anthropic/claude-mythos-5-1:auto
cycleOrder:
  - default
  - task
  - slow
  - security
statusLine:
  separator: none
  transparent: true
  compactThinkingLevel: true
  preset: custom
  leftSegments:
    - path
    - git
    - pr
    - model
    - mode
    - context_pct
  rightSegments:
    - subagents
    - session_name
    - time_spent
    - cost
    - hostname
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 30
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time:
      format: 24h
      showSeconds: false
  sessionAccent: false
terminal:
  showProgress: true
personality: pragmatic
retry:
  maxRetries: 5
  fallbackChains:
    anthropic/claude-opus-5-5:
      - anthropic/claude-opus-5
    anthropic/claude-sonnet-5-5:
      - anthropic/claude-sonnet-5
    anthropic/claude-fable-5-1:
      - anthropic/claude-opus-5-5
    anthropic/claude-mythos-5-1:
      - anthropic/claude-opus-5-5
    openai-codex/gpt-6.1-sol:
      - openai-codex/gpt-6-sol
  maxDelayMs: 0
  waitForUsageReset: true
stt:
  enabled: true
startup:
  quiet: false
  checkUpdate: false
power:
  sleepPrevention: system
memory:
  backend: mnemopi
mnemopi:
  scoping: global
  embeddingVariant: multilingual
hideThinkingBlock: true
defaultThinkingLevel: auto
disabledProviders:
  - codex
  - claude
autolearn:
  enabled: true
task:
  showResolvedModelBadge: true
  enableLsp: true
  agentModelOverrides:
    security-reviewer: "@security"
dev:
  autoqaConsent: granted
error:
  notify: "on"
readLineNumbers: true
github:
  enabled: true
vault:
  enabled: true
composer:
  shape: rail
security:
  enabled: true
tui:
  reactions: false
  titleSpinner: braille
  imeSafeCursor: true
astGrep:
  enabled: true
plan:
  autosave: true
collab:
  displayName: rkiyanchuk
display:
  showTurnTime: true
  hideToolActivity: true
title:
  icons: boring
disabledExtensions:
  - skill:skill-creator
  - skill:agentic-actions-auditor
  - skill:audit-context-building
  - skill:constant-time-analysis
  - skill:devcontainer-setup
  - skill:differential-review
  - skill:dwarf-expert
  - skill:codeql
  - skill:sarif-parsing
  - skill:semgrep
  - skill:address-sanitizer
  - skill:aflpp
  - skill:atheris
  - skill:cargo-fuzz
  - skill:open-sourcing
  - skill:supply-chain-risk-auditor
  - skill:wycheproof
  - skill:testing-handbook-generator
  - skill:ruzzy
  - skill:ossfuzz
  - skill:libfuzzer
  - skill:libafl
  - skill:harness-writing
  - skill:fuzzing-obstacles
  - skill:fuzzing-dictionary
  - skill:coverage-analysis
  - skill:constant-time-testing
emojiAutocomplete: false