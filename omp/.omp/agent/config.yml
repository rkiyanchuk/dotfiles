symbolPreset: nerd
theme: 
  dark: dark-one-hl
  light: light-one
setupVersion: 2
modelRoles: 
  default: anthropic/claude-opus-5
  slow: anthropic/claude-fable-5
  task: anthropic/claude-opus-5:xhigh
  commit: anthropic/claude-haiku-4-5
  smol: anthropic/claude-sonnet-5
  vision: openai-codex/gpt-5.6-terra
  plan: anthropic/claude-opus-5:max
cycleOrder: 
  - smol
  - default
  - slow
statusLine: 
  separator: none
  transparent: true
  compactThinkingLevel: true
  preset: custom
  leftSegments: 
    - path
    - git
    - pr
    - model
    - mode
    - context_pct
  rightSegments: 
    - subagents
    - session_name
    - time_spent
    - cost
    - hostname
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 30
    git: 
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time: 
      format: 24h
      showSeconds: false
  sessionAccent: false
terminal: 
  showProgress: true
personality: default
retry: 
  maxRetries: 5
  fallbackChains: 
    anthropic/claude-opus-5: 
      - anthropic/claude-opus-4-8
    anthropic/claude-sonnet-5: 
      - anthropic/claude-sonnet-4-6
    anthropic/claude-fable-5: 
      - anthropic/claude-opus-5
  maxDelayMs: 0
stt: 
  enabled: true
  modelName: parakeet
startup: 
  quiet: false
marketplace: 
  autoUpdate: auto
power: 
  sleepPrevention: idle
memory: 
  backend: mnemopi
mnemopi: 
  scoping: global
  embeddingVariant: multilingual
hideThinkingBlock: true
defaultThinkingLevel: auto
disabledProviders: 
  - codex
providers: 
  memoryModel: online
autolearn: 
  enabled: true
task: 
  showResolvedModelBadge: true
dev: 
  autoqaConsent: granted
error: 
  notify: "on"
readLineNumbers: true
github: 
  enabled: true
vault: 
  enabled: true
composer:
  shape: rail
security:
  enabled: true