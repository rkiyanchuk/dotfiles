symbolPreset: nerd
theme:
  dark: dark-one-hl
  light: light-one
setupVersion: 1
modelRoles:
  default: anthropic/claude-opus-5
  slow: anthropic/claude-fable-5
  plan: anthropic/claude-opus-5:max
  task: anthropic/claude-sonnet-5:xhigh
  commit: anthropic/claude-haiku-4-5
  smol: anthropic/claude-haiku-4-5
cycleOrder:
  - smol
  - task
  - default
  - slow
statusLine:
  separator: none
  transparent: true
  compactThinkingLevel: true
  preset: custom
  leftSegments:
    - path
    - git
    - pr
    - model
    - mode
    - context_pct
  rightSegments:
    - subagents
    - session_name
    - time_spent
    - cost
    - hostname
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 30
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time:
      format: 24h
      showSeconds: false
  sessionAccent: false
terminal:
  showProgress: true
personality: pragmatic
retry:
  maxRetries: 5
stt:
  enabled: true
  modelName: parakeet
startup:
  quiet: false
marketplace:
  autoUpdate: auto
power:
  sleepPrevention: idle
memory:
  backend: mnemopi
mnemopi:
  scoping: global
  embeddingVariant: multilingual
hideThinkingBlock: true
defaultThinkingLevel: auto
disabledProviders:
  - codex
providers:
  memoryModel: online
autolearn:
  enabled: true
